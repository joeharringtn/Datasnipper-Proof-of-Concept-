[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "audit-framework"
version = "1.0.0"
description = "Enterprise-grade audit automation framework for DataSnipper extraction with validation, QA workflows, and approval processes"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Audit Framework Team"}]
license = {text = "MIT"}

dependencies = [
    "openpyxl>=3.10.0",
    "pydantic[email]>=2.0.0",
    "click>=8.1.0",
    "python-dateutil>=2.8.0",
    "pytz>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "pylint>=2.17.0",
    "mypy>=1.4.0",
]

[project.scripts]
audit-cli = "audit_framework.cli:main"

[tool.black]
line-length = 100
target-version = ['py311', 'py312', 'py313']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
